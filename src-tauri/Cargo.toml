[package]
name = "voice"
version = "0.1.15"
description = "Voice dictation app"
authors = ["Voxis"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
default-run = "voice"

[lib]
name = "voice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[[bin]]
name = "voice"
path = "src/main.rs"

# Phase 7 cleanup: the `soupawhisper-overlay` egui-based subprocess
# binary was removed. Rendering is now handled by the theme-engine
# (React + WASM/WebGL code themes) inside the webview overlay,
# which covers all platforms.

[[bin]]
name = "typing_bench"
path = "src/bin/typing_bench.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-store = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2.0.0-rc.1"

# Type-safe Tauri command bindings — autogenerates src/bindings.ts
specta = { version = "=2.0.0-rc.22", features = ["chrono"] }
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }

# Pure core (config + storage — Task 1a; transcription/llm/learning/audio_wav/
# hotkey/guard — Task 1b). `rdev` enables the hotkey module's parser + rdev
# press/release listener (`voxis_core::hotkey`); voice_lib's own thin
# adapter lives in `hotkey/mod.rs`. voxis-core has zero Tauri dependency at
# all now (Task 1b's deferred Task-1a minor M1 replaced
# `AppPaths::new(&AppHandle)` with the tauri-free `AppPaths::for_desktop()`).
voxis-core = { path = "../crates/voxis-core", features = ["rdev"] }

# Parsing
# (rusqlite/rust-ini/regex moved to voxis-core with config/storage in Task
# 1a; voice_lib no longer uses them directly, only transitively.)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

# Image
png = "0.17"

# Utils
dirs = "5"
libc = "0.2"
anyhow = "1"
thiserror = "2"
once_cell = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
async-trait = "0.1"
# Production heartbeat atomic writes use NamedTempFile in the destination
# directory; std-only rename cannot cleanly replace an existing file on Windows.
tempfile = "3"

# Audio recording
cpal = "0.15"
# `[ADO-1b]`: the direct `hound` dependency here was dead — no `hound::`
# usage anywhere in `src-tauri/src` (`audio_wav`/WAV encoding moved to
# voxis-core in Task 1b and stayed there); `hound` remains in the build
# graph transitively via `rodio` (below) and via `voxis-core` itself, so
# nothing here actually loses WAV support by dropping the redundant
# direct declaration.

# Audio feedback playback (start/stop/error beeps). Small, well-tested
# wrapper over cpal; no GUI deps. Only used by `audio_feedback` module.
rodio = { version = "0.20", default-features = false, features = ["wav"] }

# FFT for spectrum analyzer visualization
rustfft = "6.2"

# Silero VAD (ONNX-based voice activity detection)
vad-rs = { git = "https://github.com/cjpais/vad-rs", default-features = false }

# HTTP client for transcription API
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Clipboard
arboard = "3"

# `profile_share`: one-shot LAN HTTP server for "Share profile to device"
# (QR/code transport of a sealed VoxisProfile, Task 7 of the
# tauri-plugin-voxis plan). `axum` version pinned to the same 0.7 line
# already resolved for `crates/voxis-fake-stt` (no duplicate major version
# in the lockfile). `qrcode`: SVG rendering with zero external network
# calls (plan requirement — no third-party QR-image services). `if-addrs`:
# enumerate non-loopback LAN interfaces so the server can bind one chosen
# IPv4 instead of `0.0.0.0` (`[R1-Safety T1]`). `getrandom` matches the
# version voxis-core's `profile::crypto` already uses for CSPRNG bytes —
# same source of randomness for `k_qr`/token/code.
axum = { version = "0.7", default-features = false, features = ["http1", "tokio"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
if-addrs = "0.15"
getrandom = "0.2"
# Constant-time token compare in `profile_share::server::TokenGate` — already
# in the dependency graph transitively via voxis-core's chacha20poly1305,
# added here directly so `voice_lib` can `use subtle::ConstantTimeEq`.
subtle = "2"

# Low-level keyboard input (for single modifier hotkeys). The parser +
# rdev press/release listener itself moved to voxis-core (Task 1b, `hotkey`
# module, feature `rdev`) — voice_lib's own `hotkey/mod.rs` no longer uses
# rdev directly, but kept as a direct dependency here too since
# `examples/test_rdev.rs` (a standalone manual rdev smoke-test, unrelated
# to the hotkey module) still does.
# Using git version with macOS main thread fix (PR #147, merged 2025-05-20)
rdev = { git = "https://github.com/Narsil/rdev", rev = "73123959276f0f29972b94e654f04614ba3826d2" }

# Cross-platform text input (fast typing via x11rb, not xdotool)
enigo = { version = "0.6", default-features = false, features = ["x11rb"] }

# Phase 7 cleanup removed the native egui/glfw overlay backend.
# Post-cleanup: replaced the lone `egui::Color32` usage with a tiny
# in-tree color type (overlay_native/color.rs), so the egui dep is
# fully gone now. Cuts ~30 transitive crates and several seconds of
# cold compile time.

# macOS: AppKit deps for the webview overlay (focus-stealing-free, all-Spaces).
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"
tauri-plugin-macos-permissions = "2.3.0"
# Thin AppKit NSWindow tuning for the webview overlay (level + Spaces parity
# with the old NSPanel). Unifies with the in-tree 0.6.4 / 0.3.2 pulled by
# tauri/wry — no duplicate crate version.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder"] }
# macOS-only override: enable `macos-private-api` needed by the webview
# overlay's transparent window (Tauri gates macOS transparency behind it).
tauri = { version = "2", features = ["tray-icon", "devtools", "macos-private-api"] }

# X11 thread safety (XInitThreads for rdev + GTK)
[target.'cfg(target_os = "linux")'.dependencies]
x11 = { version = "2.21", features = ["xlib"] }
# XKB extension for layout switching (fix punctuation on Russian layout)
x11rb = { version = "0.13", features = ["xkb"] }
# WebKitGTK minimum-size lift (Tauri upstream #6125 — 200×200 hardcoded)
webkit2gtk = "2.0.2"
gtk = "0.18.2"

[target.'cfg(windows)'.dependencies]
# Direct dependency for src/diagnostics/fatal.rs. Voxis already pulls several
# windows-sys versions transitively; using 0.59 matches the clipshot fatal
# handler and supplies SetUnhandledExceptionFilter / EXCEPTION_POINTERS
# (Win32_System_Kernel + Win32_System_Diagnostics_Debug), WriteFile
# (Win32_Storage_FileSystem + Win32_System_IO), and GetTickCount64
# (Win32_System_SystemInformation).
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_System_SystemInformation"] }

[dev-dependencies]
pretty_assertions = "1"
mockito = "1"
# Activates voxis-core's `test-utils` feature (tempfile-gated) only for
# voice_lib's own test builds, so `crate::storage::test_utils::create_temp_paths`
# keeps working without tempfile shipping in release/iOS builds of voxis-core.
voxis-core = { path = "../crates/voxis-core", features = ["test-utils"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Crash diagnostics release-profile decisions: see `[profile.release]` in the
# repo-root `/Cargo.toml`. Cargo only honours profile tables declared at the
# workspace root (`cargo build` warns "profiles for the non root package will
# be ignored" otherwise) — this table moved there when the workspace root
# moved out of this manifest (Task 1a repo-root-workspace amendment). Do NOT
# re-add `[profile.*]` here; it would silently be ignored again.
