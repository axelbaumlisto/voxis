# vm.sh build voxis <sha> -- 'bash scripts/ci/mac-shared-vm.sh'
# Copied to ~/macos-xcode26-vm/apps/voxis.conf on spex; this file is the repo copy.
# The build itself lives in the repo: scripts/ci/mac-shared-vm.sh (run in ~/src/voxis).
REPO=/home/spex/work/voxis
# build caches that survive `git clean -ffdx` in ~/src/voxis
CLEAN_KEEP="target node_modules src-tauri/target"
# pulled to ~/macos-xcode26-vm/out/voxis/<sha>/ after the build
ARTIFACTS="artifacts-mac"
