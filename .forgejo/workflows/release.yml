name: release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build/publish (e.g. v0.1.0)'
        required: true
      allow_republish:
        description: 'Overwrite an ALREADY-PUBLISHED release (breaks pinned homebrew sha — use only for a genuinely failed publish)'
        required: false
        default: 'false'

concurrency:
  group: voxis-release-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: host
    timeout-minutes: 60
    env:
      GIT_PAGER: cat
      PAGER: cat
    steps:
      - name: resolve and checkout release tag
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$tag"
          if ! echo "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: tag '$tag' does not match vX.Y.Z format"
            exit 1
          fi
          base="${CI_GIT_BASE:-$GITHUB_SERVER_URL}"
          git init -q .
          git remote add origin "${base}/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="Authorization: basic $(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0)" \
            -c protocol.version=2 fetch --depth=1 origin "refs/tags/$tag"
          git checkout -q FETCH_HEAD
          actual_tag=$(git --no-pager describe --tags --exact-match HEAD 2>/dev/null || true)
          echo "checked out tag: $actual_tag  HEAD: $(git rev-parse --short HEAD)"
          cargo_ver=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          tauri_ver=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          expected_ver="${tag#v}"
          if [ "$cargo_ver" != "$expected_ver" ]; then
            echo "ERROR: src-tauri/Cargo.toml version '$cargo_ver' != tag version '$expected_ver'"
            exit 1
          fi
          if [ "$tauri_ver" != "$expected_ver" ]; then
            echo "ERROR: tauri.conf.json version '$tauri_ver' != tag version '$expected_ver'"
            exit 1
          fi
          echo "version: $cargo_ver (matches tag)"

      - name: ci-required gate (voxis-ci container)
        run: |
          set -euo pipefail
          cache="$HOME/.cache/voxis-ci"
          mkdir -p "$cache/cargo" "$cache/target" "$cache/home"
          docker run --rm \
            -v "$PWD":/w -w /w \
            -v "$cache/cargo":/tmp/cargo-home \
            -v "$cache/target":/tmp/ci-target \
            -v "$cache/home":/tmp/cihome \
            -e CARGO_HOME=/tmp/cargo-home \
            -e CARGO_TARGET_DIR=/tmp/ci-target \
            -e HOME=/tmp/cihome \
            --user "$(id -u):$(id -g)" \
            voxis-ci:latest \
            bash -euo pipefail -c '
              bun install --frozen-lockfile && bun run build &&
              cd src-tauri && cargo clippy --all-targets -- -D warnings &&
              cargo test --lib -- --test-threads=1 && cd .. &&
              bun run test:run
            '

  build:
    runs-on: host
    needs: [test]
    timeout-minutes: 180
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    env:
      GIT_PAGER: cat
      PAGER: cat
    steps:
      - name: preflight checks
        run: |
          set -euo pipefail
          echo "=== Disk ==="
          FREE_GB=$(df -BG /home/spex --output=avail | tail -1 | tr -d ' G')
          echo "free: ${FREE_GB}G"
          # 60G, not 100G: a warm full build (Linux image + Windows target +
          # VM overlay writes + artifacts) measured well under 30G on
          # 2026-09-17 (task 6937 ran to the DMG with 106G free at start and
          # ended with 87G). The host is shared with other projects' CI
          # worktrees, so free space swings ±15G within minutes; three v0.1.6
          # attempts died at 92G/92G/99G against the old 100G line for no
          # real reason. Below 60G the risk is genuine (the qcow2 overlay
          # and docker layers can no longer grow) -- keep that as the floor.
          if [ "$FREE_GB" -lt 60 ]; then
            echo "ERROR: only ${FREE_GB}G free (need >= 60G)"
            exit 1
          fi
          echo "=== Docker ==="
          docker info --format '{{.ServerVersion}}'
          docker system df
          echo "=== Required images ==="
          missing=0
          for img in voxis-ci:latest; do
            if docker image inspect "$img" > /dev/null 2>&1; then
              echo "  ✅ $img"
            else
              echo "  ❌ $img MISSING"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "ERROR: $missing required Docker images missing"
            exit 1
          fi
          echo "=== Preflight passed ==="

      - name: resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          if ! echo "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: invalid tag '$tag'"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "tag: $tag"

      - name: guard against republishing an already-published release
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          # Re-publishing a shipped tag rebuilds artifacts with DIFFERENT bytes
          # and clobbers them under the same URLs — which breaks the homebrew
          # formula's pinned sha256 and any cached download. Refuse unless the
          # operator explicitly opts in (only for a genuinely failed publish).
          if [ "${{ inputs.allow_republish }}" = "true" ]; then
            echo "allow_republish=true — proceeding to overwrite $tag (operator override)"
            exit 0
          fi
          api="${GITHUB_SERVER_URL%/}/api/v1/repos/${GITHUB_REPOSITORY}"
          assets=$(curl -fsSL -H "Authorization: token ${GITHUB_TOKEN}" "$api/releases/tags/$tag" 2>/dev/null | \
            python3 -c 'import sys,json; d=json.load(sys.stdin); print(len(d.get("assets",[])))' 2>/dev/null || echo 0)
          if [ "${assets:-0}" -gt 0 ]; then
            echo "ERROR: release $tag already published with $assets assets."
            echo "Re-publishing would swap bytes under pinned URLs (breaks homebrew sha)."
            echo "Cut a new version (bump Cargo.toml + tauri.conf.json), or re-run with allow_republish=true."
            exit 1
          fi
          echo "no existing published assets for $tag — safe to publish"

      - name: checkout release tag in persistent worktree
        run: |
          set -euo pipefail
          REPO="/home/spex/work/voxis"
          mkdir -p "$(dirname "$REPO")"
          if [ ! -d "$REPO/.git" ]; then
            git clone "${CI_GIT_BASE:-$GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "$REPO"
          fi
          cd "$REPO"
          git remote set-url origin "${CI_GIT_BASE:-$GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="Authorization: basic $(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0)" \
            fetch --force origin "refs/tags/${{ steps.tag.outputs.tag }}" "refs/heads/main:refs/remotes/origin/main"
          # The persistent host checkout is shared with everything else that
          # runs on this host, and a stray local edit survives `git checkout`
          # whenever the file is identical between the two commits. v0.1.9
          # (2026-10-06) shipped WITHOUT macOS because a local hunk had
          # removed `macos-private-api` from src-tauri/Cargo.toml and the VM
          # faithfully built that. Leftovers are stashed (never discarded),
          # named, and the build proceeds from the tag's exact tree.
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::warning::host checkout had local modifications; stashing them as 'ci-host leftovers' so the tag's tree is built:"
            git --no-pager status --porcelain --untracked-files=no
            git stash push -m "ci-host leftovers $(date +%F) (release ${{ steps.tag.outputs.tag }})" >/dev/null
          fi
          git checkout FETCH_HEAD --detach
          [ -z "$(git status --porcelain --untracked-files=no)" ] || { echo "ERROR: checkout is still dirty"; git --no-pager status --porcelain; exit 1; }
          actual=$(git --no-pager describe --tags --exact-match HEAD 2>/dev/null || echo 'none')
          echo "checked out: $actual  HEAD: $(git rev-parse --short HEAD)"
          expected="${{ steps.tag.outputs.tag }}"; expected="${expected#v}"
          cargo_ver=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          if [ "$cargo_ver" != "$expected" ]; then
            echo "ERROR: src-tauri/Cargo.toml version '$cargo_ver' != tag '$expected'"
            exit 1
          fi

      - name: clean artifacts and build Linux + Windows (Docker)
        run: |
          set -euo pipefail
          cd /home/spex/work/voxis
          # artifacts/ holds release binaries; dist/ is vite's frontend outDir
          # (emptied by every `bun run build`). Keep them separate so parallel
          # build lanes don't wipe each other's outputs.
          rm -rf artifacts && mkdir -p artifacts
          bash scripts/build-all-platforms.sh --no-macos
          echo "=== artifacts ==="
          ls -lh artifacts/
          tag="${{ steps.tag.outputs.tag }}"
          VERSION="${tag#v}"
          expected_files=(
            "artifacts/voxis-linux-x64-gui"
            "artifacts/voxis-windows-x64-gui.exe"
            "artifacts/Voxis_${VERSION}_x64-setup.exe"
          )
          for f in "${expected_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "ERROR: expected artifact missing: $f"
              exit 1
            fi
          done
          echo "all expected Linux/Windows GUI artifacts present ✓"

      - name: build macOS (best-effort — shared Xcode 26 VM)
        continue-on-error: true
        # 100 min = vm.sh waiting up to 60 min for a busy host VM (VM_LOCK_WAIT)
        # + an 11 min cold build; the job's own budget is 180 min and
        # Linux/Windows take ~40.
        timeout-minutes: 100
        run: |
          # The runner starts this step with `bash -e`, and errexit MUST be off
          # here: the step is advisory and every exit code is handled
          # explicitly below. A busy host VM makes vm.sh exit non-zero by
          # design, and a missing artifact file makes `ls` non-zero (a warning,
          # not a failure) -- with errexit either would abort the step before
          # the warning runs.
          set +e -uo pipefail
          REPO=/home/spex/work/voxis
          VM_DIR=/home/spex/macos-xcode26-vm
          VM="$VM_DIR/vm.sh"
          cd "$REPO"
          # The macOS app lane runs on the SHARED macOS 26 / Xcode 26 VM
          # (~/macos-xcode26-vm, README there), not on the old Docker-OSX
          # Sonoma clone: one `vm.sh build` call produces all three artifacts
          # below (signed .app -> notarized + stapled -> DMG, plus the bare
          # arm64 binary and tarball the Homebrew formula pins). The build
          # itself lives in the repo (scripts/ci/mac-shared-vm.sh, run in the
          # guest at ~/src/voxis); on the host only apps/voxis.conf is needed.
          #
          # Preflight: the app layer must be registered on the shared VM.
          # Missing -> advisory skip, same semantics as the old image preflight.
          if [ ! -f "$VM_DIR/apps/voxis.conf" ]; then
            echo "::warning::no $VM_DIR/apps/voxis.conf — skipping macOS (register the app: $VM_DIR/README.md 'Adding clipshot / voxis')"
            exit 0
          fi
          if [ ! -e /dev/kvm ]; then
            echo "::warning::/dev/kvm not available — skipping macOS"
            exit 0
          fi
          # vm.sh pushes this sha from $REPO into the guest and NEVER fetches,
          # so it must be the commit the checkout step above left in the same
          # persistent worktree (HEAD there = the release tag).
          SHA=$(git rev-parse HEAD)
          [ -n "$SHA" ] || { echo "::warning::cannot resolve HEAD in $REPO — skipping macOS"; exit 0; }
          echo "sha: $SHA"
          OUT="$VM_DIR/out/voxis/$SHA"
          # vm.sh rsyncs (never deletes) into $OUT/artifacts-mac -- drop any
          # leftovers of an earlier run so nothing stale reaches artifacts/.
          rm -rf "$OUT/artifacts-mac"

          # One macOS VM per host: vm.sh waits VM_LOCK_WAIT seconds (default
          # 15) for /home/spex/.macos-vm.lock AND for a lock-less macOS
          # container (naked/clipshot) to disappear, then exits non-zero BEFORE
          # booting — so no retry loop and no parsing of its error text here.
          # 3600 s covers a whole build of another project; this step's 100 min
          # budget still leaves room for the ~11 min cold build afterwards.
          log=$(mktemp)
          VM_LOCK_WAIT=3600 "$VM" build voxis "$SHA" -- 'bash scripts/ci/mac-shared-vm.sh' 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          rm -f "$log"
          if [ "$rc" -ne 0 ]; then
            # Advisory either way: the host VM stayed busy for the whole 60 min
            # wait (vm.sh says «another macOS VM holds …» / «a macOS VM is
            # already running»), or the build itself failed.
            echo "::warning::macOS lane skipped (rc=$rc, advisory — not blocking the release): either the host macOS VM stayed busy for 60 min ('another macOS VM holds' / 'already running' in build.log) or the build failed; log: $OUT/build.log"
            exit 0
          fi

          # Same artifact directory the publish step reads.
          mkdir -p artifacts
          cp -f "$OUT"/artifacts-mac/* artifacts/ 2>/dev/null || true
          echo "=== macOS artifacts (arm64-only; ort has no x86_64-darwin prebuilt) ==="
          ls -lh artifacts/voxis-macos-arm64 artifacts/voxis-macos-arm64.tar.gz artifacts/Voxis_*_aarch64.dmg 2>/dev/null
          for f in voxis-macos-arm64 voxis-macos-arm64.tar.gz; do
            [ -f "artifacts/$f" ] || echo "::warning::macOS build succeeded but artifacts/$f is missing (log: $OUT/build.log)"
          done
          ls artifacts/Voxis_*_aarch64.dmg >/dev/null 2>&1 \
            || echo "::warning::macOS build succeeded but no Voxis_*_aarch64.dmg was pulled (log: $OUT/build.log)"
          echo "✅ macOS build finished"

      # No iOS gate here: the plugin's iOS build is verified by naked's CI lane and by scripts/check-ios-build.sh on a dev Mac.

      - name: publish to Forgejo release
        run: |
          set -euo pipefail
          cd /home/spex/work/voxis
          tag="${{ steps.tag.outputs.tag }}"
          VERSION="${tag#v}"
          api="${GITHUB_SERVER_URL%/}/api/v1/repos/${GITHUB_REPOSITORY}"
          auth="Authorization: token ${GITHUB_TOKEN}"
          rid=$(curl -fsSL -H "$auth" "$api/releases/tags/$tag" 2>/dev/null | \
                python3 -c 'import sys,json;print(json.load(sys.stdin).get("id",""))' 2>/dev/null || true)
          if [ -z "$rid" ]; then
            echo "creating release $tag"
            rid=$(curl -fsSL -X POST -H "$auth" -H "Content-Type: application/json" \
              "$api/releases" \
              -d "{\"tag_name\":\"$tag\",\"name\":\"$tag\",\"draft\":false,\"prerelease\":false}" | \
              python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          fi
          echo "release id: $rid"
          # Explicit required set + best-effort extras. Do NOT rely on a single
          # glob: the rpm is named `Voxis-<ver>-1.x86_64.rpm` (capital V, HYPHEN)
          # and the deb `Voxis_<ver>_amd64.deb` (underscore) — a `voxis-*`/`Voxis_*`
          # glob silently drops the rpm. List deb/rpm via their own explicit globs.
          artifacts=(
            "artifacts/voxis-linux-x64-gui"
            "artifacts/voxis-windows-x64-gui.exe"
            "artifacts/Voxis_${VERSION}_x64-setup.exe"
          )
          shopt -s nullglob
          for f in artifacts/*.deb artifacts/*.rpm \
                   artifacts/voxis-macos-arm64 artifacts/voxis-macos-arm64.tar.gz \
                   artifacts/Voxis_*_aarch64.dmg; do
            artifacts+=("$f")
          done
          shopt -u nullglob
          # Fail loudly if the Linux packages didn't build (they are required,
          # not best-effort) so a naming/build regression can't silently ship a
          # release without deb+rpm.
          ls artifacts/*.deb >/dev/null 2>&1 || { echo "ERROR: no .deb in artifacts/"; exit 1; }
          ls artifacts/*.rpm >/dev/null 2>&1 || { echo "ERROR: no .rpm in artifacts/"; exit 1; }
          for f in "${artifacts[@]}"; do
            [ -f "$f" ] || { echo "skip missing $f"; continue; }
            name="$(basename "$f")"
            existing=$(curl -fsSL -H "$auth" "$api/releases/$rid/assets" 2>/dev/null | \
              python3 -c "import sys,json;[print(a['id']) for a in json.load(sys.stdin) if a['name']=='$name']" 2>/dev/null || true)
            for aid in $existing; do
              curl -fsSL -X DELETE -H "$auth" "$api/releases/$rid/assets/$aid" >/dev/null 2>&1 || true
            done
            echo "uploading $name"
            curl -fsSL -X POST -H "$auth" \
              -F "attachment=@$f;filename=$name" \
              "$api/releases/$rid/assets?name=$name" >/dev/null
          done

      - name: publish to GitHub release (public binaries only)
        continue-on-error: true
        run: |
          set -euo pipefail
          cd /home/spex/work/voxis
          tag="${{ steps.tag.outputs.tag }}"
          VER="${tag#v}"
          if ! command -v gh >/dev/null 2>&1; then
            echo "WARNING: gh CLI missing; skipping GitHub release"
            exit 0
          fi
          # CRITICAL: the Forgejo runner exports GITHUB_TOKEN (and sometimes
          # GH_TOKEN) set to the FORGEJO token. gh CLI prefers those env vars
          # over its keyring, so it would try to auth to github.com with a
          # Forgejo token and fail. Unset them so gh uses ~/.config/gh auth
          # (account axelbaumlisto).
          unset GITHUB_TOKEN GH_TOKEN GITHUB_SERVER_URL
          gh release create "$tag" --repo axelbaumlisto/voxis --title "v$VER" --notes-file CHANGELOG.md || true
          # Explicit globs per artifact class. A single `voxis-*`/`Voxis_*` glob
          # silently drops the rpm (`Voxis-<ver>-1.x86_64.rpm`: capital V, hyphen).
          shopt -s nullglob
          files=(
            artifacts/voxis-linux-x64-gui
            artifacts/voxis-windows-x64-gui.exe
            artifacts/Voxis_*_x64-setup.exe
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/voxis-macos-arm64
            artifacts/voxis-macos-arm64.tar.gz
            artifacts/Voxis_*_aarch64.dmg
          )
          shopt -u nullglob
          ls artifacts/*.deb >/dev/null 2>&1 || { echo "ERROR: no .deb for GitHub release"; exit 1; }
          ls artifacts/*.rpm >/dev/null 2>&1 || { echo "ERROR: no .rpm for GitHub release"; exit 1; }
          gh release upload "$tag" "${files[@]}" --repo axelbaumlisto/voxis --clobber

          # DRIFT GUARD (2026-11-11, v0.1.9/0.1.10/0.1.13 lost their Linux and
          # Windows assets on GitHub while this pipeline — whose only DELETE
          # calls target Forgejo — kept uploading). GitHub is supposed to hold
          # the FULL history: `releases/latest` is what the landing site links
          # and the Homebrew formula pins a specific asset URL, so a silently
          # emptied release is a broken invariant, not a cosmetic gap.
          #
          # This release must end with every expected file...
          expected=0
          missing=()
          for f in "${files[@]}"; do
            [ -f "$f" ] || continue
            expected=$((expected + 1))
          done
          published=$(gh release view "$tag" --repo axelbaumlisto/voxis --json assets --jq '.assets|length')
          echo "GitHub release $tag: $published asset(s), $expected expected"
          if [ "$published" -lt "$expected" ]; then
            echo "::error::GitHub release $tag has $published asset(s) but $expected were uploaded — publish is incomplete"
            exit 1
          fi
          # ...and the previous three releases must still HAVE assets. An empty
          # older release means history was stripped outside this pipeline.
          for old_tag in $(gh release list --repo axelbaumlisto/voxis --limit 4 --json tagName --jq '.[].tagName' | grep -v "^${tag}$" | head -3); do
            n=$(gh release view "$old_tag" --repo axelbaumlisto/voxis --json assets --jq '.assets|length')
            if [ "$n" -eq 0 ]; then
              echo "::warning::GitHub release $old_tag has NO assets — history was stripped outside this pipeline (see .forgejo/workflows/release.yml drift guard)"
            else
              echo "  $old_tag: $n asset(s)"
            fi
          done

          # Keep the built artifacts for this tag on the host. Each release
          # overwrites artifacts/, so without this an asset stripped from
          # GitHub can only be rebuilt from the tag — this makes restoring it a
          # copy instead of a 40-minute release rerun.
          archive="$HOME/voxis-release-archive/$tag"
          mkdir -p "$archive"
          cp -a "${files[@]}" "$archive"/ 2>/dev/null || true
          echo "archived $(ls -1 "$archive" | wc -l | tr -d ' ') artifact(s) to $archive"

      # NOTE: no voxis.top/dist mirror step. voxis.top is served by Vercel (the
      # landing site), not this spex host's Caddy, so files copied under spex
      # would be unreachable at voxis.top. The landing's Download buttons point
      # directly at github.com/axelbaumlisto/voxis/releases (the GitHub release
      # published in the build job), which is the canonical download channel.

      - name: update Homebrew formula (advisory)
        continue-on-error: true
        env:
          # Push the regenerated formula into the tap repo so `brew tap
          # axelbaumlisto/voxis` (-> github.com/axelbaumlisto/homebrew-voxis)
          # resolves it. update-homebrew.sh builds an authenticated github.com
          # URL from `gh auth token` (Forgejo GITHUB_TOKEN unset) and gates the
          # push on a tarball integrity check.
          HOMEBREW_TAP_REPO: https://github.com/axelbaumlisto/homebrew-voxis.git
        run: |
          set -euo pipefail
          cd /home/spex/work/voxis
          bash scripts/ci/update-homebrew.sh "${{ steps.tag.outputs.tag }}" || true

      - name: restore repo to main
        if: always()
        # This step used to be three commands each ending in `|| true`. On
        # 2026-09-25 the persistent worktree's local main turned out to be a
        # July history with no common ancestor to origin/main; `pull --ff-only`
        # failed silently on every release since 2026-09-14, the worktree stayed
        # on the old main, and the publish job's prune step then ran against a
        # tree in which scripts/prune-release-assets.sh did not exist -- three
        # releases, three WARN lines, three green runs, 491 MB not freed.
        #
        # The worktree is shared state that the next job reads, so leaving it
        # wrong is not a degraded success. Force it to origin/main and say so
        # if that changed anything unexpected.
        run: |
          set -euo pipefail
          cd /home/spex/work/voxis
          # The build itself dirties the tree (the checkout was verified clean
          # before it): tauri-cli rewrites src-tauri/Cargo.toml's tauri features
          # on the non-mac targets (drops `macos-private-api`), build:themes
          # regenerates the theme bundles and appends to the known builtin
          # digests, update-homebrew.sh rewrites the in-tree formula. Left
          # behind, they ride along `checkout -B main`
          # and the next release has to stash them (three stashes piled up on
          # 2026-11-13). Discard exactly these build outputs; anything ELSE is
          # someone's edit -> stash it, never discard.
          generated=(src-tauri/Cargo.toml homebrew-tap/Formula/voxis.rb src-tauri/themes src-tauri/known-builtin-digests.json crates/tauri-plugin-voxis/guest-js/src/themes/generated)
          git checkout -- "${generated[@]}"
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::warning::unexpected local modifications after the build; stashing them:"
            git --no-pager status --porcelain --untracked-files=no
            git stash push -m "ci-host unexpected leftovers $(date +%F) (release ${{ steps.tag.outputs.tag }})" >/dev/null
          fi
          git fetch --force origin "refs/heads/main:refs/remotes/origin/main"
          before=$(git rev-parse --short HEAD)
          git checkout -q -B main origin/main
          # Warn, don't fail: the artifacts are built, publish must still run.
          [ -z "$(git status --porcelain --untracked-files=no)" ] || { echo "::warning::host checkout still dirty after restore"; git --no-pager status --porcelain; }
          echo "repo restored to main: $before -> $(git rev-parse --short HEAD) (= origin/main)"

  # docs regeneration is DECOUPLED from release — see .forgejo/workflows/docs.yml
  # (scheduled + workflow_dispatch). Releasing a binary has nothing to do with
  # docs freshness, and the non-deterministic screenshot agents (Vite+Playwright)
  # must not sit on the release critical path. The docs workflow runs the agents
  # in an isolated clone and opens a PR to GitHub main, which triggers the
  # existing GitHub Pages deploy (.github/workflows/pages.yml).

  publish:
    runs-on: host
    # Gates on build only. Docs regeneration is a separate workflow (docs.yml),
    # not part of the release, so publication verification never waits on it.
    needs: [build]
    timeout-minutes: 10
    steps:
      - name: verify package publication
        run: |
          set -euo pipefail
          tag="${{ needs.build.outputs.tag }}"
          VERSION="${tag#v}"
          API="${GITHUB_SERVER_URL%/}/api/v1/repos/${GITHUB_REPOSITORY}"
          echo "=== Forgejo release assets ==="
          fg_names=$(curl -fsSL -H "Authorization: token ${GITHUB_TOKEN}" "$API/releases/tags/$tag" | \
            python3 -c 'import sys,json; d=json.load(sys.stdin); [print(a.get("name")) for a in d.get("assets", [])]')
          echo "$fg_names" | sed 's/^/ - /'
          echo "Forgejo asset count: $(echo "$fg_names" | grep -c .)"
          # Assert deb + rpm actually made it (the rpm's Voxis-…rpm name previously
          # slipped through globs and shipped to neither forge).
          echo "$fg_names" | grep -q '\.deb$' || { echo "ERROR: Forgejo release missing .deb"; exit 1; }
          echo "$fg_names" | grep -q '\.rpm$' || { echo "ERROR: Forgejo release missing .rpm"; exit 1; }
          echo "=== local artifacts (bare ls — no globs that could hide a mis-named file) ==="
          ls -la /home/spex/work/voxis/artifacts/ 2>/dev/null || true
          # Signed macOS DMG is advisory/best-effort (KVM VM + notarization can
          # legitimately fail or be skipped) — informational only, never gates
          # the release the way deb/rpm do above.
          if echo "$fg_names" | grep -q '\.dmg$'; then
            echo "macOS signed DMG present in Forgejo release ✓"
          else
            # Advisory, not a hard-fail (KVM VM + notarization can legitimately
            # fail or be skipped) — but make the degradation LOUD: a maintainer
            # skimming a green run must not mistake "advisory" for "invisible".
            echo "::warning::no signed macOS DMG in this release ($tag) — macOS lane degraded or skipped, see docs/MACOS_SIGNING_TODO.md"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              echo "⚠️ **No signed macOS DMG in $tag** — macOS lane degraded or skipped (advisory, see \`docs/MACOS_SIGNING_TODO.md\`)." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "=== GitHub release probe (canonical download channel) ==="
          if command -v gh >/dev/null 2>&1; then
            # subshell unsets the Forgejo GITHUB_TOKEN so gh uses its own keyring
            gh_names=$( unset GITHUB_TOKEN GH_TOKEN GITHUB_SERVER_URL; \
              gh release view "$tag" --repo axelbaumlisto/voxis --json assets \
                -q '.assets[].name' 2>/dev/null ) || gh_names=""
            echo "$gh_names" | sed 's/^/ - /'
            if [ -n "$gh_names" ]; then
              # GitHub is the CANONICAL public download channel (landing buttons +
              # homebrew tarball URL point here), so a missing package is a hard
              # failure — same bar as Forgejo. Only assert when gh actually
              # returned assets, so a gh-auth/network outage degrades to the
              # "empty" branch below rather than a false failure.
              echo "$gh_names" | grep -q '\.deb$' || { echo "ERROR: GitHub release missing .deb"; exit 1; }
              echo "$gh_names" | grep -q '\.rpm$' || { echo "ERROR: GitHub release missing .rpm"; exit 1; }
            else
              echo "WARNING: gh returned no assets (auth/network?); could not verify GitHub release"
            fi
          else
            echo "gh CLI unavailable; skipping GitHub probe"
          fi

      - name: prune binaries from older Forgejo releases
        # Runs LAST in this job, after the release above has been verified
        # complete (deb+rpm asserted, DMG probed) — never touch older releases
        # until the just-published one is confirmed intact. Forgejo attachments
        # are a duplicate archive (GitHub is the canonical download channel and
        # keeps full history); see scripts/prune-release-assets.sh for why.
        # No `|| echo WARN` here any more. That clause turned "the script is not
        # in this tree" into a green run three releases running (see the restore
        # step in build). The release is already published and verified above,
        # so a red prune step cannot undo it -- but it can be seen, and an unseen
        # failure is what let 491 MB accumulate.
        run: |
          set -euo pipefail
          cd /home/spex/work/voxis
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "ERROR: worktree HEAD $(git rev-parse --short HEAD) != origin/main $(git rev-parse --short origin/main); the restore step in build did not do its job"
            exit 1
          fi
          [ -x scripts/prune-release-assets.sh ] || { echo "ERROR: scripts/prune-release-assets.sh missing from $(git rev-parse --short HEAD)"; exit 1; }
          tag="${{ needs.build.outputs.tag }}"
          FORGEJO_API="${GITHUB_SERVER_URL%/}/api/v1/repos/${GITHUB_REPOSITORY}" \
          FORGEJO_TOKEN="${GITHUB_TOKEN}" \
            bash scripts/prune-release-assets.sh --keep-tag "$tag" --apply
