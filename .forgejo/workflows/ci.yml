name: ci
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fast:
    runs-on: host
    timeout-minutes: 60
    env:
      GIT_PAGER: cat
      PAGER: cat
    steps:
      - name: reap stale ci containers
        run: |
          set -euo pipefail
          now=$(date +%s)
          seen=""
          for id in $(
            docker ps -aq --filter "label=voxis.ci.owner" 2>/dev/null || true
            docker ps -aq --filter "ancestor=voxis-ci:latest" 2>/dev/null || true
          ); do
            case " $seen " in *" $id "*) continue;; esac
            seen="$seen $id"
            created=$(docker inspect --format '{{.Created}}' "$id" 2>/dev/null) || continue
            created_ts=$(date -d "$created" +%s 2>/dev/null) || continue
            age=$(( now - created_ts ))
            if [ "$age" -ge 7200 ]; then
              docker rm -f "$id" >/dev/null 2>&1 || true
            fi
          done

      - name: checkout (manual; Forgejo /git subpath breaks actions/checkout URL)
        run: |
          set -euo pipefail
          base="${CI_GIT_BASE:-$GITHUB_SERVER_URL}"
          git init -q .
          git remote add origin "${base}/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="Authorization: basic $(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0)" \
            -c protocol.version=2 fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
          git --no-pager log --oneline -1

      - name: ci-required (frontend build + clippy + tdd + lib/bin tests) in voxis-ci image
        run: |
          set -euo pipefail
          name="voxis-ci-fast-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}"
          docker rm -f "$name" >/dev/null 2>&1 || true
          cache="$HOME/.cache/voxis-ci"
          mkdir -p "$cache/cargo" "$cache/target" "$cache/home"
          # timeout-minutes on the job cancels the runner step but the container survives
          # on the host with its bind-mount intact -- three clipshot containers accumulated
          # 28 core-days this way. An in-container timeout ensures self-termination.
          docker run --rm \
            --name "$name" \
            --label voxis.ci.owner=fast \
            -v "$PWD":/w -w /w \
            -v "$cache/cargo":/tmp/cargo-home \
            -v "$cache/target":/tmp/ci-target \
            -v "$cache/home":/tmp/cihome \
            -e CARGO_HOME=/tmp/cargo-home \
            -e CARGO_TARGET_DIR=/tmp/ci-target \
            -e HOME=/tmp/cihome \
            --user "$(id -u):$(id -g)" \
            voxis-ci:latest \
            timeout --signal=TERM --kill-after=30s 50m \
            bash -euo pipefail -c '
              echo "=== frontend build (dist required by tauri) ===" &&
              bun install --frozen-lockfile && bun run build &&
              echo "=== [required] clippy ===" &&
              cd src-tauri && cargo clippy --all-targets -- -D warnings && cd .. &&
              echo "=== [required] rust lib tests (serial) ===" &&
              cd src-tauri && cargo test --lib -- --test-threads=1 && cd .. &&
              echo "=== [required] frontend tests ===" &&
              # vitest CLI is `#!/usr/bin/env node`; node must be in the image
              # (installed in Dockerfile.ci) or vi.mock hoisting degrades under
              # the bun runtime and ~100 mock-based tests fail spuriously.
              bun run test:run
            '

  # Task 3.5 tracer bullet: `voxis-fake-stt` (protocol-compat + fixture
  # tests, no network) + the REAL `host-min` Tauri binary driven end to
  # end against a real `voxis-fake-stt` server under `xvfb-run` (the
  # voxis-ci image has libwebkit2gtk-4.1/libgtk-3/xvfb -- see
  # Dockerfile.ci -- so this runs the actual binary, not a browser/
  # webview-driver stand-in; see `examples/host-min/README.md` for why a
  # Playwright/tauri-driver harness was not added in this same change).
  # Independent of `fast` above -- a failure here never blocks it.
  host-min-e2e:
    runs-on: host
    timeout-minutes: 30
    env:
      GIT_PAGER: cat
      PAGER: cat
    steps:
      - name: reap stale ci containers
        run: |
          set -euo pipefail
          now=$(date +%s)
          seen=""
          for id in $(
            docker ps -aq --filter "label=voxis.ci.owner" 2>/dev/null || true
            docker ps -aq --filter "ancestor=voxis-ci:latest" 2>/dev/null || true
          ); do
            case " $seen " in *" $id "*) continue;; esac
            seen="$seen $id"
            created=$(docker inspect --format '{{.Created}}' "$id" 2>/dev/null) || continue
            created_ts=$(date -d "$created" +%s 2>/dev/null) || continue
            age=$(( now - created_ts ))
            if [ "$age" -ge 7200 ]; then
              docker rm -f "$id" >/dev/null 2>&1 || true
            fi
          done

      - name: checkout (manual; Forgejo /git subpath breaks actions/checkout URL)
        run: |
          set -euo pipefail
          base="${CI_GIT_BASE:-$GITHUB_SERVER_URL}"
          git init -q .
          git remote add origin "${base}/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="Authorization: basic $(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0)" \
            -c protocol.version=2 fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
          git --no-pager log --oneline -1

      - name: voxis-fake-stt tests + host-min real-binary smoke (mock capture + fake-stt, no real mic/Groq) in voxis-ci image
        run: |
          set -euo pipefail
          name="voxis-ci-host-min-e2e-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}"
          docker rm -f "$name" >/dev/null 2>&1 || true
          cache="$HOME/.cache/voxis-ci"
          mkdir -p "$cache/cargo" "$cache/target" "$cache/home"
          docker run --rm \
            --name "$name" \
            --label voxis.ci.owner=host-min-e2e \
            -v "$PWD":/w -w /w \
            -v "$cache/cargo":/tmp/cargo-home \
            -v "$cache/target":/tmp/ci-target \
            -v "$cache/home":/tmp/cihome \
            -e CARGO_HOME=/tmp/cargo-home \
            -e CARGO_TARGET_DIR=/tmp/ci-target \
            -e HOME=/tmp/cihome \
            --user "$(id -u):$(id -g)" \
            voxis-ci:latest \
            timeout --signal=TERM --kill-after=30s 25m \
            bash -euo pipefail -c '
              echo "=== [required] voxis-fake-stt unit + protocol-compat + fixture tests ===" &&
              cargo test -p voxis-fake-stt &&
              echo "=== [required] host-min real-binary smoke (speech + silence + speech-streamdied, mock capture + fake-stt) ===" &&
              # host-min-smoke.sh itself bundles guest-js into ui/vendor/
              # (review fix F4 -- that directory is gitignored, generated
              # fresh every run) and THEN builds host-min, so frontendDist
              # is never stale/missing at compile time; no separate
              # `cargo build -p host-min` before this.
              xvfb-run -a bash crates/tauri-plugin-voxis/examples/host-min/scripts/host-min-smoke.sh
            '

  # Task 12: `voxis-core`/`tauri-plugin-voxis` had ZERO cargo-test/clippy
  # coverage in this file before this job -- `fast`'s clippy/test steps
  # above run from `src-tauri` without `--workspace`, so they only ever
  # touch the `voice` package; `host-min-e2e` above only runs
  # `cargo test -p voxis-fake-stt` (plus the real-binary smoke, which
  # exercises the plugin but not via `cargo test`/clippy). Deliberately
  # NOT `cargo test --workspace`: this workspace also has `host-min` as a
  # member (a full Tauri app example), which would pull it into every
  # run's compile time for no benefit here (`[ADO-4 minors]`).
  core-plugin:
    runs-on: host
    timeout-minutes: 30
    env:
      GIT_PAGER: cat
      PAGER: cat
    steps:
      - name: reap stale ci containers
        run: |
          set -euo pipefail
          now=$(date +%s)
          seen=""
          for id in $(
            docker ps -aq --filter "label=voxis.ci.owner" 2>/dev/null || true
            docker ps -aq --filter "ancestor=voxis-ci:latest" 2>/dev/null || true
          ); do
            case " $seen " in *" $id "*) continue;; esac
            seen="$seen $id"
            created=$(docker inspect --format '{{.Created}}' "$id" 2>/dev/null) || continue
            created_ts=$(date -d "$created" +%s 2>/dev/null) || continue
            age=$(( now - created_ts ))
            if [ "$age" -ge 7200 ]; then
              docker rm -f "$id" >/dev/null 2>&1 || true
            fi
          done

      - name: checkout (manual; Forgejo /git subpath breaks actions/checkout URL)
        run: |
          set -euo pipefail
          base="${CI_GIT_BASE:-$GITHUB_SERVER_URL}"
          git init -q .
          git remote add origin "${base}/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="Authorization: basic $(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0)" \
            -c protocol.version=2 fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
          git --no-pager log --oneline -1

      - name: voxis-core + tauri-plugin-voxis + voxis-fake-stt test + clippy, guest-js build/test, in voxis-ci image
        run: |
          set -euo pipefail
          name="voxis-ci-core-plugin-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}"
          docker rm -f "$name" >/dev/null 2>&1 || true
          cache="$HOME/.cache/voxis-ci"
          mkdir -p "$cache/cargo" "$cache/target" "$cache/home"
          docker run --rm \
            --name "$name" \
            --label voxis.ci.owner=core-plugin \
            -v "$PWD":/w -w /w \
            -v "$cache/cargo":/tmp/cargo-home \
            -v "$cache/target":/tmp/ci-target \
            -v "$cache/home":/tmp/cihome \
            -e CARGO_HOME=/tmp/cargo-home \
            -e CARGO_TARGET_DIR=/tmp/ci-target \
            -e HOME=/tmp/cihome \
            --user "$(id -u):$(id -g)" \
            voxis-ci:latest \
            timeout --signal=TERM --kill-after=30s 25m \
            bash -euo pipefail -c '
              echo "=== [required] cargo test -p voxis-core -p tauri-plugin-voxis -p voxis-fake-stt (NOT --workspace, see job comment) ===" &&
              cargo test -p voxis-core -p tauri-plugin-voxis -p voxis-fake-stt &&
              echo "=== [required] clippy -D warnings (voxis-core + tauri-plugin-voxis only) ===" &&
              cargo clippy -p voxis-core -p tauri-plugin-voxis --all-targets -- -D warnings &&
              echo "=== [required] guest-js build + test ===" &&
              (cd crates/tauri-plugin-voxis/guest-js && bun install --frozen-lockfile && bun run build && bun run test)
            '

      # B2 (2026-09-19): the mobile half of the plugin (`src/mobile.rs`,
      # cfg(ios|android) after C1) is compiled by NO desktop test/clippy run;
      # plugin-v0.3.0 shipped with a syntax error there and only a host's iOS
      # build caught it. iOS needs an Apple toolchain (release.yml's macOS-VM
      # lane runs scripts/check-ios-build.sh); Android needs only the NDK's
      # clang for `ring`'s build script -- and the runner host already has the
      # SDK/NDK the naked-cli Android lane uses, so this runs on the host, not
      # in voxis-ci (an NDK layer there would be ~1 GB for one `cc` call).
      - name: "[required] B2: Android cross-check (cargo check aarch64-linux-android, host NDK)"
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          ndk="$(ls -d "$sdk"/ndk/* 2>/dev/null | sort -V | tail -1)"
          [ -n "$ndk" ] || { echo "no NDK under $sdk/ndk -- the Android cross-check cannot run on this host" >&2; exit 1; }
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          clang="$(ls "$bin"/aarch64-linux-android*-clang | sort -V | tail -1)"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add aarch64-linux-android >/dev/null
          export CC_aarch64_linux_android="$clang" AR_aarch64_linux_android="$bin/llvm-ar" \
                 CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$clang" \
                 CARGO_TARGET_DIR="$HOME/.cache/voxis-ci/target-android" \
                 GIT_CONFIG_COUNT=0
          echo "NDK: $ndk"
          cargo check -p voxis-core -p tauri-plugin-voxis --target aarch64-linux-android

      # Advisory only: the voxis-ci image does not currently install
      # cargo-audit (Dockerfile.ci has no `cargo install cargo-audit`
      # step) -- this step is a no-op today, not a silently-skipped real
      # check. Remove `continue-on-error` (and the `command -v` guard
      # below) once cargo-audit is added to the image, so a real finding
      # then actually blocks this job.
      - name: cargo audit (advisory -- see step comment)
        continue-on-error: true
        run: |
          set -euo pipefail
          name="voxis-ci-audit-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}"
          docker rm -f "$name" >/dev/null 2>&1 || true
          cache="$HOME/.cache/voxis-ci"
          docker run --rm \
            --name "$name" \
            --label voxis.ci.owner=audit \
            -v "$PWD":/w -w /w \
            -v "$cache/cargo":/tmp/cargo-home \
            -v "$cache/target":/tmp/ci-target \
            -v "$cache/home":/tmp/cihome \
            -e CARGO_HOME=/tmp/cargo-home \
            -e CARGO_TARGET_DIR=/tmp/ci-target \
            -e HOME=/tmp/cihome \
            --user "$(id -u):$(id -g)" \
            voxis-ci:latest \
            timeout --signal=TERM --kill-after=30s 10m \
            bash -euo pipefail -c '
              if command -v cargo-audit >/dev/null 2>&1; then
                cargo audit
              else
                echo "::warning::cargo-audit not installed in voxis-ci:latest -- skipping (see step comment)"
              fi
            '
