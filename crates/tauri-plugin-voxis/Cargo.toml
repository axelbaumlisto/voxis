[package]
name = "tauri-plugin-voxis"
version = "0.8.0"
edition = "2021"
rust-version = "1.77.2"
description = "Voxis dictation as an embeddable Tauri 2 plugin (desktop + iOS): commands/events contract, AudioCapture/SecretStore traits, MockCapture (Task 3), and the real capture -> guard -> transcription -> dictionary -> llm pipeline with Hold-mode heartbeat lease and injectable event emission (Task 3b)"
license = "MIT"
# Tauri-plugin convention (mirrors the naked host's `tauri-plugin-capture`/
# `tauri-plugin-lifecycle`): `links` lets Cargo enforce a single copy of
# this plugin's build-script output in a dependency graph.
links = "tauri-plugin-voxis"

[lib]
# Crate/module name the JS side and any Rust host import
# (`tauri_plugin_voxis::init()`); package name stays the conventional
# `tauri-plugin-<name>` for crates.io/npm-adjacent tooling.
name = "tauri_plugin_voxis"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
# Path dep, NO features enabled by default — this crate must stay
# `aarch64-apple-ios`-buildable with zero feature flags, same gate as
# `voxis-core` itself (`scripts/check-ios-build.sh`). Task 4 turns on the
# `rdev` feature only for its desktop-only `hotkey_desktop.rs`.
voxis-core = { path = "../voxis-core" }

# Mirrors naked's `tauri-plugin-capture`/`tauri-plugin-lifecycle` Cargo.toml
# shape verbatim: base `tauri` dep with no extra features on top of
# whatever the host's runtime provides, `wry` added back only for the iOS
# target (mobile plugin macros need a concrete `Runtime` there).
tauri = { version = "2", features = [] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
# `rt`/`macros`/`time` added in Task 3b for the async pipeline
# (`pipeline.rs`'s 250ms guard-poll `tokio::time::interval`, the 1 Hz
# heartbeat lease in `lease.rs`, `#[tokio::test]`) on top of the `sync`
# already used by `capture.rs`'s `tokio::sync::watch`.
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
uuid = { version = "1", features = ["v4"] }
# Dictionary-replacement application (Task 3b `pipeline.rs`) used to
# duplicate `voxis_core::storage::dictionary::DictionaryStorage::apply`'s
# case-insensitive word-boundary regex directly against its own `regex`
# dependency; that logic now lives in `voxis_core::storage::dictionary::
# apply_entries` (shared by both crates), and this crate calls it rather
# than building its own `Regex` — no direct `regex` dependency needed
# here any more (`voxis-core` still depends on it for that shared impl).

# Task 6: `import_profile_from_qr`'s plain-HTTP GET to the desktop's
# on-LAN profile-share server (Task 7, `[R1-Safety T1]` — that server is
# deliberately plain HTTP, not HTTPS: LAN-only, single-use token, short
# TTL). `default-features = false` drops reqwest's default TLS/system-
# configuration features; this crate never dials `https://`.
reqwest = { version = "0.12", default-features = false }

# Task 4, all optional and pulled in only by the `desktop` feature below —
# a plain (non-target-gated) dependency, same as `voxis-core`'s own
# `rdev` optional dep: `cargo build -p tauri-plugin-voxis --target
# aarch64-apple-ios` (default, zero features) must never see cpal/rdev,
# which the `desktop` feature (not the target) gates.
cpal = { version = "0.15", optional = true }
# Same pinned git rev as voice_lib/voxis-core (macOS main-thread fix, PR
# #147) — one rdev revision across the whole workspace.
rdev = { git = "https://github.com/Narsil/rdev", rev = "73123959276f0f29972b94e654f04614ba3826d2", optional = true }
# WAV finalization at `stop()` reuses `voxis_core::audio_wav` (hound is
# voxis-core's own dependency, not re-exposed) — this crate's `desktop.rs`
# has no direct hound usage, so no `dep:hound` is declared here.

[target.'cfg(target_os = "ios")'.dependencies]
tauri = { version = "2", features = ["wry"] }

[features]
default = []
# Desktop capture (`CpalCapture`) + hotkey (`RdevHotkey`) backends. Off by
# default so the iOS build (`scripts/check-ios-build.sh`) stays cpal/rdev-
# free with zero feature flags — see `capture.rs`'s and `voxis-core`'s own
# module docs for the same gate.
desktop = ["dep:cpal", "dep:rdev", "voxis-core/rdev"]

[dev-dependencies]
tempfile = "3"
mockito = "1"
# Task 6 `profile_source.rs` tests: byte-verifies mtime+sha256 of the
# desktop's fixture DBs are unchanged after a full read-only profile
# import. Same version voxis-core already pins.
sha2 = "0.10"
# Task 6 `profile_source.rs` tests: opens a second, direct write
# connection to a fixture desktop config.db to simulate a concurrently-
# running Voxis holding a write transaction during import. Same version +
# `bundled` feature voxis-core already pins.
rusqlite = { version = "0.32", features = ["bundled"] }
# `test-util` (for `tokio::time::pause`/`advance`, `#[tokio::test(start_paused
# = true)]`) is additive only for this crate's own test builds — cargo
# does not fold dev-dependency features into the plain `cargo build` of
# the library itself.
# `rt-multi-thread` (round-2 review, F2 scenario A/B tests): those two
# tests deliberately block a real OS thread inside a synchronous trait
# method (`AudioCapture::stop`/`SecretStore::get`) to pin down the exact
# TOCTOU window `cancelled` closes -- on the default `current_thread`
# test runtime that would deadlock the single worker thread against the
# test's own task, so those two tests opt into
# `#[tokio::test(flavor = "multi_thread", worker_threads = 2)]` instead.
tokio = { version = "1", features = ["test-util", "rt-multi-thread"] }
