# Hand-written (NOT autogenerated — that's `permissions/autogenerated/**`,
# written by `build.rs`/`tauri_plugin::Builder` from `COMMANDS`). Every
# tauri-plugin needs an explicit `default` permission set for a host's
# capability file (`src-tauri/capabilities/*.json`) to reference as
# `"voxis:default"` instead of naming all twelve `allow-*` permissions
# individually. Task 3 allows every command unconditionally — none of them
# take a pre-configured scope (unlike e.g. `tauri-plugin-fs`'s path scopes),
# so there is nothing narrower to default to yet.
"$schema" = "./schemas/schema.json"

[default]
description = "Allows all voxis dictation-plugin commands: start, stop, cancel, state, get_profile, apply_profile, import_profile_from_desktop, import_profile_from_qr, set_provider, set_hotkey, set_consent, hold_lease."
permissions = [
  "allow-start",
  "allow-stop",
  "allow-cancel",
  "allow-state",
  "allow-get-profile",
  "allow-apply-profile",
  "allow-import-profile-from-desktop",
  "allow-import-profile-from-qr",
  "allow-set-provider",
  "allow-set-hotkey",
  "allow-set-consent",
  "allow-hold-lease",
]
