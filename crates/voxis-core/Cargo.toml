[package]
name = "voxis-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "Pure-Rust core (config + storage + transcription + llm + learning + hotkey/guard logic) for Voxis, buildable for iOS with no Tauri/desktop deps"
license = "MIT"

[lib]
# rlib only: this crate is a plain Rust dependency of voice_lib (and later
# tauri-plugin-voxis), not a cdylib/staticlib target itself.
name = "voxis_core"
doctest = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rust-ini = "0.21"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
libc = "0.2"
tracing = "0.1"
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
thiserror = "2"
async-trait = "0.1"
once_cell = "1"

# WAV encoding (`audio_wav` — Task 1b, moved from voice_lib::audio::encoder).
hound = "3.5"

# HTTP client for `transcription` (Groq Whisper API) and `llm` (chat
# completions) — same features voice_lib's Cargo.toml already used
# (`rustls-tls`, no native OpenSSL dependency for iOS).
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls"], default-features = false }

# Optional: `storage::test_utils::create_temp_paths` is a normal
# (non-`#[cfg(test)]`) public helper so voice_lib's own tests can use it too
# — `#[cfg(test)]` never crosses the crate boundary (it would only activate
# when *building voxis-core's own* test target, not when voice_lib depends
# on it normally). Gated behind `test-utils` (off by default) so release/iOS
# builds don't ship tempfile; this crate's own tests get it unconditionally
# via [dev-dependencies] below.
tempfile = { version = "3", optional = true }

# Optional: only the `hotkey` module (parser + rdev press/release listener,
# moved from voice_lib::hotkey in Task 1b) needs rdev, and only when built
# as voice_lib's dependency (desktop). Off by default so
# `cargo build -p voxis-core --target aarch64-apple-ios` (no feature flags)
# never touches rdev. Same pinned git rev voice_lib's Cargo.toml already
# used (macOS main-thread fix, PR #147).
rdev = { git = "https://github.com/Narsil/rdev", rev = "73123959276f0f29972b94e654f04614ba3826d2", optional = true }

# `profile` module (Task 2): VoxisProfile export/import + sealing. All
# pure-Rust, no OpenSSL (rustls-equivalent for symmetric crypto — these are
# the RustCrypto crates, no C dependency at all), and all pinned to the
# newest version still compatible with this crate's `rust-version = 1.77.2`
# (verified via `cargo add --dry-run`: 0.13/0.11/0.6/0.11 lines require
# rustc 1.85 and were rejected in favour of these).
hkdf = "0.12"
sha2 = "0.10"
# Argon2id key derivation for `KeySource::Passphrase`. Default features
# (`alloc`, `password-hash`, `rand`) kept — we only use the low-level
# `Argon2::hash_password_into` (not the `password-hash` trait API), but
# disabling default features isn't worth the risk of a subtle no_std gap
# for a one-shot KDF call.
argon2 = "0.5"
# ChaCha20-Poly1305 AEAD for `seal`/`open`. Default features (`alloc`,
# `getrandom`, `rand_core`) kept.
chacha20poly1305 = "0.10"
# CSPRNG bytes for salt/nonce generation (`getrandom::getrandom`).
getrandom = "0.2"
# base64url encoding helper (`profile::crypto::{encode_base64url,
# decode_base64url}`) for embedding sealed/keying bytes in text contexts
# (e.g. Task 7's QR payload `k: base64url(k_qr)`) — not exercised by this
# task's own fixtures, but the dependency + helper are added here per the
# step's dependency list so downstream tasks don't need to re-pin it.
base64 = "0.23"

[features]
rdev = ["dep:rdev"]
test-utils = ["dep:tempfile"]

[dev-dependencies]
# Unconditional here so voxis-core's own `cargo test` always has it,
# regardless of the `test-utils` feature (which only matters for downstream
# consumers like voice_lib — see the `[dependencies]` comment above).
tempfile = "3"
# `transcription`/`llm` integration tests use mockito (HTTP mocking) and
# `#[tokio::test]` (async test harness) — dev-only, matching voice_lib's
# pre-Task-1b dependency set for these same tests.
mockito = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
