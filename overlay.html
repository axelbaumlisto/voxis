<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overlay</title>
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        background: transparent;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        touch-action: none;
      }
      /* Center the pill inside whatever OS window we got. Some Linux
       * compositors ignore inner_size hints for transparent borderless
       * windows and force a minimum (~200x200); this keeps the visual
       * coherent: the pink icon stays centered, the rest is transparent. */
      #root {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* Hover handles: hidden until `body.pointer-inside`
       * (src/overlay/useHandleVisibility.ts), pinned during a gesture. */
      .drag-grip,
      .resize-grip {
        position: fixed;
        box-sizing: border-box;
        touch-action: none;
        user-select: none;
        z-index: 2147483647;
        opacity: 0;
        pointer-events: none;
        /* Promote to its own compositor layer so the FADE-IN always animates:
         * without this the browser may skip the first transition frame from an
         * un-composited opacity:0 element, so the handles popped in abruptly on
         * hover while the fade-out (from a painted opacity:1) stayed smooth. */
        will-change: opacity;
        transition: opacity 160ms ease-out;
      }
      body.pointer-inside .drag-grip,
      body.pointer-inside .resize-grip {
        opacity: 1;
        pointer-events: auto;
      }
      /* Move: green ✛, top-left. Grabbing style once the hold has armed. */
      .drag-grip {
        left: 0;
        top: 0;
        width: 13px;
        height: 13px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        cursor: grab;
        color: #fff;
        background: rgba(34, 197, 94, 0.9);
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
        line-height: 13px;
        font-size: 8px;
        font-weight: 700;
      }
      .drag-grip.dragging {
        cursor: grabbing;
        background: rgba(34, 197, 94, 0.98);
      }
      /* Resize: three dots, bottom-right. */
      .resize-grip {
        right: 0;
        bottom: 0;
        width: 14px;
        height: 14px;
        cursor: nwse-resize;
        border-radius: 3px;
        background:
          radial-gradient(circle at 30% 70%, rgba(255, 255, 255, 0.95) 1.2px, transparent 1.6px),
          radial-gradient(circle at 70% 70%, rgba(255, 255, 255, 0.95) 1.2px, transparent 1.6px),
          radial-gradient(circle at 70% 30%, rgba(255, 255, 255, 0.95) 1.2px, transparent 1.6px),
          rgba(0, 0, 0, 0.35);
      }
      /* The overlay's own bounds, drawn only while the user is moving or
       * resizing it: an orb fills the window edge to edge, so without this
       * there is nothing to say where the window actually ends. */
      .resize-frame {
        position: fixed;
        inset: 0;
        border: 1px solid rgba(255, 255, 255, 0.55);
        border-radius: 6px;
        box-sizing: border-box;
        pointer-events: none;
        opacity: 0;
        transition: opacity 120ms ease;
        z-index: 2147483646;
      }
      .resize-frame.visible {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/overlay.tsx"></script>
  </body>
</html>
