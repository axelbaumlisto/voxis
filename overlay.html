<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overlay</title>
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        background: transparent;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        touch-action: none;
      }
      /* Center the pill inside whatever OS window we got. Some Linux
       * compositors ignore inner_size hints for transparent borderless
       * windows and force a minimum (~200x200); this keeps the visual
       * coherent: the pink icon stays centered, the rest is transparent. */
      #root {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* Drag grip: hidden until the pointer is over the overlay. CSS :hover is
       * maintained by the layout engine from the real pointer position, so it
       * neither sticks (unlike JS pointerout, which the Dock webview drops) nor
       * blinks (unlike a JS idle timer). */
      .drag-grip {
        opacity: 0;
        pointer-events: none;
        transition: opacity 140ms ease;
      }
      body:hover .drag-grip {
        opacity: 1;
        pointer-events: auto;
      }
      .drag-grip.dragging {
        opacity: 1 !important;
        pointer-events: auto !important;
      }
      /* Right after a drag the pointer is still over the overlay and pointer
       * capture can leave :hover stuck true (the webview drops the leave), so
       * the grip would "stay lit". Force it hidden until the pointer genuinely
       * re-enters (enter events are reliable; leave events are not). */
      .drag-grip.post-drag {
        opacity: 0 !important;
        pointer-events: none !important;
      }
      /* Resize grip: bottom-right corner, same reveal rule as the drag grip. */
      .resize-grip {
        opacity: 0;
        pointer-events: none;
        transition: opacity 140ms ease;
      }
      body:hover .resize-grip {
        opacity: 1;
        pointer-events: auto;
      }
      .resize-grip.resizing {
        opacity: 1 !important;
        pointer-events: auto !important;
      }
      .resize-grip.post-drag {
        opacity: 0 !important;
        pointer-events: none !important;
      }
      /* The overlay's own bounds, drawn only while the user is moving or
       * resizing it: an orb fills the window edge to edge, so without this
       * there is nothing to say where the window actually ends. */
      .resize-frame {
        position: fixed;
        inset: 0;
        border: 1px solid rgba(255, 255, 255, 0.55);
        border-radius: 6px;
        box-sizing: border-box;
        pointer-events: none;
        opacity: 0;
        transition: opacity 120ms ease;
        z-index: 2147483646;
      }
      .resize-frame.visible {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/overlay.tsx"></script>
  </body>
</html>
