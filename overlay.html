<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overlay</title>
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        background: transparent;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        touch-action: none;
      }
      /* Center the pill inside whatever OS window we got. Some Linux
       * compositors ignore inner_size hints for transparent borderless
       * windows and force a minimum (~200x200); this keeps the visual
       * coherent: the pink icon stays centered, the rest is transparent. */
      #root {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* Drag grip: hidden until the pointer is over the overlay. CSS :hover is
       * maintained by the layout engine from the real pointer position, so it
       * neither sticks (unlike JS pointerout, which the Dock webview drops) nor
       * blinks (unlike a JS idle timer). */
      .drag-grip {
        opacity: 0;
        pointer-events: none;
        transition: opacity 140ms ease;
      }
      body:hover .drag-grip {
        opacity: 1;
        pointer-events: auto;
      }
      .drag-grip.dragging {
        opacity: 1 !important;
        pointer-events: auto !important;
      }
      /* Right after a drag the pointer is still over the overlay and pointer
       * capture can leave :hover stuck true (the webview drops the leave), so
       * the grip would "stay lit". Force it hidden until the pointer genuinely
       * re-enters (enter events are reliable; leave events are not). */
      .drag-grip.post-drag {
        opacity: 0 !important;
        pointer-events: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/overlay.tsx"></script>
  </body>
</html>
